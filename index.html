<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perla — Jewelry</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600&family=Noto+Serif+Armenian:wdth,wght@87.5,300..500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261116c">
</head>
<body>
  <div class="topbar">
    <div class="promos">
      <span data-i18n="top1"></span>
      <span data-i18n="top2"></span>
    </div>
  </div>

  <header class="header">
    <a class="logo" href="#top"><img class="logo-img" src="assets/logo.jpg?v=perla2" width="1100" height="730" alt="Perla — jewelry"></a>
    <div class="mid">
      <nav class="nav" id="nav">
        <a href="#bestsellers" data-i18n="nav_shop"></a>
        <a href="#bestsellers" data-i18n="nav_best"></a>
        <a href="#categories" data-i18n="nav_collections"></a>
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#about" data-i18n="nav_journal"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="hy" lang="hy">ՀԱՅ</button>
        <button type="button" data-lang="ru" lang="ru">РУС</button>
        <button type="button" data-lang="en" lang="en">ENG</button>
      </div>
    </div>
    <div class="icons">
      <button class="icon-btn music" id="musicBtn" type="button" aria-pressed="false" data-i18n-aria="music_on"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg></button>
      <button class="icon-btn" id="searchBtn" type="button" aria-expanded="false" data-i18n-aria="search_label"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
      <button class="icon-btn" id="userBtn" type="button" aria-haspopup="dialog" data-i18n-aria="auth_account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><span class="avatar" id="avatar"></span></button>
      <button class="icon-btn bag" id="cartBtn" type="button" aria-expanded="false" data-i18n-aria="cart_title"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg><b id="count">0</b></button>
      <button class="burger" id="burger" aria-expanded="false" data-i18n-aria="menu">☰</button>
    </div>
    <form class="searchbar" id="searchbar" role="search" hidden>
      <input type="search" id="q" autocomplete="off" data-i18n-ph="search_ph" data-i18n-aria="search_label">
      <button type="button" id="qclose" data-i18n-aria="search_close">✕</button>
    </form>
  </header>

  <main id="top">
    <section class="hero" id="hero" aria-roledescription="carousel">
      <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
      <div class="hero-text">
        <p class="eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <a class="btn" href="#bestsellers" data-i18n="hero_btn"></a>
      </div>
      <div class="hero-ctrl" id="heroCtrl" hidden>
        <button type="button" class="hc-prev" id="heroPrev" data-i18n-aria="slide_prev">‹</button>
        <div class="hc-dots" id="heroDots"></div>
        <button type="button" class="hc-next" id="heroNext" data-i18n-aria="slide_next">›</button>
      </div>
    </section>

    <section class="cats" id="categories">
      <div class="cat" data-cat="c_rings"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_rings"><svg viewBox="0 0 48 48"><circle cx="24" cy="30" r="11"/><path d="M19 15l5-7 5 7-5 4z"/></svg><span data-i18n="c_rings"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_rings" hidden></div></div>
      <div class="cat" data-cat="c_earrings"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_earrings"><svg viewBox="0 0 48 48"><circle cx="16" cy="32" r="6"/><circle cx="32" cy="32" r="6"/><path d="M16 26V10M32 26V10"/></svg><span data-i18n="c_earrings"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_earrings" hidden></div></div>
      <div class="cat" data-cat="c_necklaces"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_necklaces"><svg viewBox="0 0 48 48"><path d="M8 8c0 18 10 22 16 22s16-4 16-22"/><circle cx="24" cy="36" r="5"/></svg><span data-i18n="c_necklaces"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_necklaces" hidden></div></div>
      <div class="cat" data-cat="c_bracelets"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_bracelets"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/></svg><span data-i18n="c_bracelets"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_bracelets" hidden></div></div>
      <div class="cat" data-cat="c_chains"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_chains"><svg viewBox="0 0 48 48"><path d="M6 14c6 22 30 22 36 0"/></svg><span data-i18n="c_chains"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_chains" hidden></div></div>
      <div class="cat" data-cat="c_new"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_new"><svg viewBox="0 0 48 48"><path d="M24 6c1 11 7 17 18 18-11 1-17 7-18 18-1-11-7-17-18-18 11-1 17-7 18-18z"/></svg><span data-i18n="c_new"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_new" hidden></div></div>
      <div class="cat" data-cat="c_gifts"><button type="button" class="cat-btn" aria-expanded="false" aria-controls="dd-c_gifts"><svg viewBox="0 0 48 48"><rect x="8" y="18" width="32" height="22"/><path d="M6 18h36v-6H6zM24 12v28M24 12c-8-8-14 0-6 0M24 12c8-8 14 0 6 0"/></svg><span data-i18n="c_gifts"></span><i class="chev" aria-hidden="true"></i></button><div class="dd" id="dd-c_gifts" hidden></div></div>
    </section>

    <section class="section" id="bestsellers">
      <div class="section-head"><h2 data-i18n="best_title"></h2><a href="#contact" data-i18n="view_all"></a></div>
      <div class="filterbar" id="filterbar" hidden><span id="filterLabel"></span><button type="button" id="filterClear" data-i18n-aria="search_close">✕</button></div>
      <div class="grid" id="products"></div>
      <p class="noresults" id="noresults" hidden data-i18n="search_none"></p>
    </section>

    <section class="section duo" id="about">
      <div class="story">
        <div class="story-art"><img src="assets/vase.png" alt="" data-i18n-alt="alt_vase"></div>
        <div class="story-text">
          <p class="eyebrow" data-i18n="story_eyebrow"></p>
          <h2 data-i18n="story_title"></h2>
          <p data-i18n="story_text"></p>
          <a class="link" href="#contact" data-i18n="story_link"></a>
        </div>
      </div>
      <div class="portrait"><img src="assets/portrait.png" alt="" data-i18n-alt="alt_portrait"></div>
    </section>

    <section class="section" id="promise">
      <p class="eyebrow center" data-i18n="promise_title"></p>
      <div class="promise">
        <div><svg viewBox="0 0 48 48"><path d="M10 38C8 20 20 8 40 8c0 20-12 32-30 30zM10 38L28 20"/></svg><div><h3 data-i18n="pr1_t"></h3><p data-i18n="pr1_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><path d="M24 40C8 28 6 18 12 14c5-3 9 0 12 5 3-5 7-8 12-5 6 4 4 14-12 26z"/></svg><div><h3 data-i18n="pr2_t"></h3><p data-i18n="pr2_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c-9 9-9 25 0 34M24 7c9 9 9 25 0 34"/></svg><div><h3 data-i18n="pr3_t"></h3><p data-i18n="pr3_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><path d="M24 6l16 6v12c0 10-7 15-16 18C15 39 8 34 8 24V12z"/></svg><div><h3 data-i18n="pr4_t"></h3><p data-i18n="pr4_d"></p></div></div>
      </div>
    </section>


    <section class="subscribe" id="contact">
      <b data-i18n="sub_title"></b>
      <p data-i18n="sub_text"></p>
      <form id="form" novalidate>
        <input type="email" id="email" required data-i18n-ph="sub_ph" data-i18n-aria="sub_ph">
        <button class="btn" type="submit" data-i18n="sub_btn"></button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="f-brand">
      <p data-i18n="f_brand"></p>
    </div>
    <div><h4 data-i18n="f_shop"></h4><a href="#bestsellers" data-i18n="f_all"></a><a href="#bestsellers" data-i18n="nav_best"></a><a href="#bestsellers" data-i18n="c_new"></a><a href="#bestsellers" data-i18n="c_rings"></a><a href="#bestsellers" data-i18n="c_earrings"></a><a href="#bestsellers" data-i18n="c_necklaces"></a><a href="#bestsellers" data-i18n="c_bracelets"></a><a href="#bestsellers" data-i18n="c_chains"></a></div>
    <div><h4 data-i18n="f_collections"></h4><a href="#categories" data-i18n="f_essentials"></a><a href="#categories" data-i18n="f_heirlooms"></a><a href="#categories" data-i18n="f_sculptural"></a><a href="#categories" data-i18n="f_pearls"></a><a href="#categories" data-i18n="f_minimal"></a></div>
    <div><h4 data-i18n="f_help"></h4><a href="#contact" data-i18n="f_faq"></a><a href="#contact" data-i18n="f_shipping"></a><a href="#contact" data-i18n="f_track"></a></div>
    <div><h4 data-i18n="f_contact"></h4>
      <div class="social" id="social">
        <a data-social="instagram" href="https://www.instagram.com/perla.jewelry.am/" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="dot"/></svg></a>
        <a data-social="facebook" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></a>
        <a data-social="whatsapp" aria-label="WhatsApp" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 19z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8c-1.2-.5-2.2-1.5-2.7-2.7l.8-1-1-2z" class="fill"/></svg></a>
      </div>
    </div>
    <div class="services">
      <p><b>▭</b> <span data-i18n="s1"></span></p>
    </div>
    <div class="copy"><span data-i18n="copy1"></span><span class="credit" data-i18n="credit"></span><span><span data-i18n="copy2"></span> <a href="https://github.com/ElHakobyan/concha">GitHub</a></span></div>
  </footer>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="cart" id="cart" aria-hidden="true" aria-labelledby="cartTitle">
    <div class="cart-head"><h3 id="cartTitle" data-i18n="cart_title"></h3><button type="button" id="cartClose" data-i18n-aria="search_close">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="total"><span data-i18n="cart_total"></span><b id="cartTotal">$0.00</b></div>
      <form class="order-form" id="orderForm" novalidate>
        <div class="order-fields" id="orderFields" hidden>
          <label><span data-i18n="order_name"></span><input id="oName" autocomplete="name" maxlength="100"></label>
          <label><span data-i18n="order_phone"></span><input id="oPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+374 99 123456" maxlength="30"></label>
          <label><span data-i18n="order_email"></span><input id="oEmail" type="email" autocomplete="email" maxlength="254"></label>
          <label><span data-i18n="order_address"></span><input id="oAddress" autocomplete="street-address" maxlength="300"></label>
          <label><span data-i18n="order_comment"></span><textarea id="oComment" rows="2" maxlength="1000"></textarea></label>
        </div>
        <button class="btn" type="submit" id="checkout" data-i18n="cart_checkout"></button>
        <p class="msg ok" id="cartMsg" role="status"></p>
      </form>
    </div>
  </aside>

  <dialog class="auth" id="auth" aria-labelledby="authTitle">
    <button type="button" class="auth-x" id="authClose" data-i18n-aria="search_close">✕</button>
    <h3 id="authTitle"></h3>
    <form id="authForm" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="register" data-i18n="auth_register"></button>
        <button type="button" role="tab" data-mode="login" data-i18n="auth_login"></button>
      </div>
      <label data-reg><span data-i18n="auth_name"></span><input id="aName" autocomplete="given-name"></label>
      <label data-reg><span data-i18n="auth_surname"></span><input id="aSurname" autocomplete="family-name"></label>
      <label><span data-i18n="auth_email"></span><input id="aEmail" type="email" autocomplete="email"></label>
      <label data-reg><span data-i18n="auth_phone"></span><input id="aPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+374 99 123456"></label>
      <label><span data-i18n="auth_pass"></span><input id="aPass" type="password" autocomplete="new-password"></label>
      <label data-reg><span data-i18n="auth_pass2"></span><input id="aPass2" type="password" autocomplete="new-password"></label>
      <p class="msg" id="authMsg" role="alert"></p>
      <button class="btn" type="submit" id="authSubmit"></button>
      <p class="auth-note" data-i18n="auth_note"></p>
    </form>
    <div id="account" hidden>
      <p class="hello" id="hello"></p>
      <button class="btn" type="button" id="logout" data-i18n="auth_logout"></button>
    </div>
  </dialog>

  <script src="config.js?v=20261116c"></script>
  <script src="i18n.js?v=20261116c"></script>
  <script src="script.js?v=20261116c"></script>
</body>
</html>
