<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concha — Jewelry</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600&family=Noto+Serif+Armenian:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo-shell" viewBox="0 0 200 200"><path d="M92.0 178.0L76.0 188.0L124.0 188.0L108.0 178.0Z" fill="#faf8f5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M92.0 178.0 L9.4 112.2 Q2.9 85.1 30.2 90.4 Q31.1 62.6 56.0 75.0 Q64.2 48.4 85.0 67.0 Q100.0 43.6 115.0 67.0 Q135.8 48.4 144.0 75.0 Q168.9 62.6 169.8 90.4 Q197.1 85.1 190.6 112.2 L108.0 178.0 Z" fill="#faf8f5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M97.8 170.3L10.3 112.8M98.4 170.2L30.9 91.3M99.0 170.1L56.4 76.0M99.7 170.0L85.1 68.1M100.3 170.0L114.9 68.1M101.0 170.1L143.6 76.0M101.6 170.2L169.1 91.3M102.2 170.3L189.7 112.8" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".38" stroke-linecap="round"/><g text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#faf8f5" stroke-linejoin="round"><text x="100" y="113" font-family="'Cormorant Garamond',Georgia,serif" font-size="22" font-weight="500" letter-spacing="2.6" stroke-width="6">CONCHA</text><text x="100" y="130" font-family="'Jost',Arial,sans-serif" font-size="9.5" font-weight="500" letter-spacing="3.6" stroke-width="5">JEWELRY</text></g></symbol></svg>
  <div class="topbar">
    <div class="promos">
      <span data-i18n="top1"></span>
      <span data-i18n="top2"></span>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="hy" lang="hy">ՀԱՅ</button>
      <button type="button" data-lang="ru" lang="ru">РУС</button>
      <button type="button" data-lang="en" lang="en">ENG</button>
    </div>
  </div>

  <header class="header">
    <a class="logo" href="#top"><svg class="logo-mark" viewBox="0 0 200 200" role="img" aria-label="Concha Jewelry"><use href="#logo-shell"/></svg></a>
    <nav class="nav" id="nav">
      <a href="#bestsellers" data-i18n="nav_shop"></a>
      <a href="#bestsellers" data-i18n="nav_best"></a>
      <a href="#categories" data-i18n="nav_collections"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#about" data-i18n="nav_journal"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="icons">
      <button class="icon-btn" id="searchBtn" type="button" aria-expanded="false" data-i18n-aria="search_label"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
      <button class="icon-btn" id="userBtn" type="button" aria-haspopup="dialog" data-i18n-aria="auth_account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><span class="avatar" id="avatar"></span></button>
      <button class="icon-btn bag" id="cartBtn" type="button" aria-expanded="false" data-i18n-aria="cart_title"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg><b id="count">0</b></button>
      <button class="burger" id="burger" aria-expanded="false" data-i18n-aria="menu">☰</button>
    </div>
    <form class="searchbar" id="searchbar" role="search" hidden>
      <input type="search" id="q" autocomplete="off" data-i18n-ph="search_ph" data-i18n-aria="search_label">
      <button type="button" id="qclose" data-i18n-aria="search_close">✕</button>
    </form>
  </header>

  <main id="top">
    <section class="hero" id="hero" aria-roledescription="carousel">
      <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
      <div class="hero-text">
        <p class="eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <a class="btn" href="#bestsellers" data-i18n="hero_btn"></a>
      </div>
      <div class="hero-ctrl" id="heroCtrl" hidden>
        <button type="button" class="hc-prev" id="heroPrev" data-i18n-aria="slide_prev">‹</button>
        <div class="hc-dots" id="heroDots"></div>
        <button type="button" class="hc-next" id="heroNext" data-i18n-aria="slide_next">›</button>
      </div>
    </section>

    <section class="cats" id="categories">
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><circle cx="24" cy="30" r="11"/><path d="M19 15l5-7 5 7-5 4z"/></svg><span data-i18n="c_rings"></span></a>
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><circle cx="16" cy="32" r="6"/><circle cx="32" cy="32" r="6"/><path d="M16 26V10M32 26V10"/></svg><span data-i18n="c_earrings"></span></a>
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><path d="M8 8c0 18 10 22 16 22s16-4 16-22"/><circle cx="24" cy="36" r="5"/></svg><span data-i18n="c_necklaces"></span></a>
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/></svg><span data-i18n="c_bracelets"></span></a>
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><path d="M6 14c6 22 30 22 36 0"/></svg><span data-i18n="c_chains"></span></a>
      <a href="#bestsellers"><svg viewBox="0 0 48 48"><path d="M24 6c1 11 7 17 18 18-11 1-17 7-18 18-1-11-7-17-18-18 11-1 17-7 18-18z"/></svg><span data-i18n="c_new"></span></a>
      <a href="#contact"><svg viewBox="0 0 48 48"><rect x="8" y="18" width="32" height="22"/><path d="M6 18h36v-6H6zM24 12v28M24 12c-8-8-14 0-6 0M24 12c8-8 14 0 6 0"/></svg><span data-i18n="c_gifts"></span></a>
    </section>

    <section class="section" id="bestsellers">
      <div class="section-head"><h2 data-i18n="best_title"></h2><a href="#contact" data-i18n="view_all"></a></div>
      <div class="grid" id="products"></div>
      <p class="noresults" id="noresults" hidden data-i18n="search_none"></p>
    </section>

    <section class="section duo" id="about">
      <div class="story">
        <div class="story-art"><img src="assets/vase.png" alt="" data-i18n-alt="alt_vase"></div>
        <div class="story-text">
          <p class="eyebrow" data-i18n="story_eyebrow"></p>
          <h2 data-i18n="story_title"></h2>
          <p data-i18n="story_text"></p>
          <a class="link" href="#contact" data-i18n="story_link"></a>
        </div>
      </div>
      <div class="portrait"><img src="assets/portrait.png" alt="" data-i18n-alt="alt_portrait"></div>
    </section>

    <section class="section" id="promise">
      <p class="eyebrow center" data-i18n="promise_title"></p>
      <div class="promise">
        <div><svg viewBox="0 0 48 48"><path d="M10 38C8 20 20 8 40 8c0 20-12 32-30 30zM10 38L28 20"/></svg><div><h3 data-i18n="pr1_t"></h3><p data-i18n="pr1_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><path d="M24 40C8 28 6 18 12 14c5-3 9 0 12 5 3-5 7-8 12-5 6 4 4 14-12 26z"/></svg><div><h3 data-i18n="pr2_t"></h3><p data-i18n="pr2_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c-9 9-9 25 0 34M24 7c9 9 9 25 0 34"/></svg><div><h3 data-i18n="pr3_t"></h3><p data-i18n="pr3_d"></p></div></div>
        <div><svg viewBox="0 0 48 48"><path d="M24 6l16 6v12c0 10-7 15-16 18C15 39 8 34 8 24V12z"/></svg><div><h3 data-i18n="pr4_t"></h3><p data-i18n="pr4_d"></p></div></div>
      </div>
    </section>


    <section class="subscribe" id="contact">
      <b data-i18n="sub_title"></b>
      <p data-i18n="sub_text"></p>
      <form id="form" novalidate>
        <input type="email" id="email" required data-i18n-ph="sub_ph" data-i18n-aria="sub_ph">
        <button class="btn" type="submit" data-i18n="sub_btn"></button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="f-brand">
      <p data-i18n="f_brand"></p>
    </div>
    <div><h4 data-i18n="f_shop"></h4><a href="#bestsellers" data-i18n="f_all"></a><a href="#bestsellers" data-i18n="nav_best"></a><a href="#bestsellers" data-i18n="c_new"></a><a href="#bestsellers" data-i18n="c_rings"></a><a href="#bestsellers" data-i18n="c_earrings"></a><a href="#bestsellers" data-i18n="c_necklaces"></a><a href="#bestsellers" data-i18n="c_bracelets"></a><a href="#bestsellers" data-i18n="c_chains"></a></div>
    <div><h4 data-i18n="f_collections"></h4><a href="#categories" data-i18n="f_essentials"></a><a href="#categories" data-i18n="f_heirlooms"></a><a href="#categories" data-i18n="f_sculptural"></a><a href="#categories" data-i18n="f_pearls"></a><a href="#categories" data-i18n="f_minimal"></a></div>
    <div><h4 data-i18n="f_help"></h4><a href="#contact" data-i18n="f_faq"></a><a href="#contact" data-i18n="f_shipping"></a><a href="#contact" data-i18n="f_track"></a><a href="#contact" data-i18n="f_contact"></a></div>
    <div class="services">
      <p><b>▭</b> <span data-i18n="s1"></span></p>
      <p><b>↺</b> <span data-i18n="s2"></span></p>
      <p><b>▢</b> <span data-i18n="s3"></span></p>
    </div>
    <div class="copy"><span data-i18n="copy1"></span><span><span data-i18n="copy2"></span> <a href="https://github.com/ElHakobyan/concha">GitHub</a></span></div>
  </footer>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="cart" id="cart" aria-hidden="true" aria-labelledby="cartTitle">
    <div class="cart-head"><h3 id="cartTitle" data-i18n="cart_title"></h3><button type="button" id="cartClose" data-i18n-aria="search_close">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="total"><span data-i18n="cart_total"></span><b id="cartTotal">$0.00</b></div>
      <button class="btn" type="button" id="checkout" data-i18n="cart_checkout"></button>
      <p class="msg ok" id="cartMsg" role="status"></p>
    </div>
  </aside>

  <dialog class="auth" id="auth" aria-labelledby="authTitle">
    <button type="button" class="auth-x" id="authClose" data-i18n-aria="search_close">✕</button>
    <h3 id="authTitle"></h3>
    <form id="authForm" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="register" data-i18n="auth_register"></button>
        <button type="button" role="tab" data-mode="login" data-i18n="auth_login"></button>
      </div>
      <label data-reg><span data-i18n="auth_name"></span><input id="aName" autocomplete="given-name"></label>
      <label data-reg><span data-i18n="auth_surname"></span><input id="aSurname" autocomplete="family-name"></label>
      <label><span data-i18n="auth_email"></span><input id="aEmail" type="email" autocomplete="email"></label>
      <label data-reg><span data-i18n="auth_phone"></span><input id="aPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+374 99 123456"></label>
      <label><span data-i18n="auth_pass"></span><input id="aPass" type="password" autocomplete="new-password"></label>
      <label data-reg><span data-i18n="auth_pass2"></span><input id="aPass2" type="password" autocomplete="new-password"></label>
      <p class="msg" id="authMsg" role="alert"></p>
      <button class="btn" type="submit" id="authSubmit"></button>
      <p class="auth-note" data-i18n="auth_note"></p>
    </form>
    <div id="account" hidden>
      <p class="hello" id="hello"></p>
      <button class="btn" type="button" id="logout" data-i18n="auth_logout"></button>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
