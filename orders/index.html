<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Perla — Мои заказы</title><link rel="icon" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#282421;--line:#e4dbd1;--bg:#f8f5f1;--muted:#81766e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Jost,'Noto Sans Armenian',sans-serif}header{padding:24px max(20px,calc((100vw - 900px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:inherit;text-decoration:none}.brand{font:40px 'Cormorant Garamond',serif;letter-spacing:.12em}main{max-width:900px;margin:48px auto;padding:0 20px 70px}h1{font:48px 'Cormorant Garamond',serif;font-weight:500;margin:0 0 10px}.intro{color:var(--muted);margin-bottom:32px}.order{border:1px solid var(--line);border-radius:12px;background:white;padding:24px;margin-bottom:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.number{font-weight:600}.status{font-size:13px;padding:7px 12px;border-radius:24px;background:#f1eae3}.meta{font-size:14px;color:var(--muted);margin:10px 0 18px}.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0}.steps li{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:10px}.steps li.done{border-color:#716450;color:var(--ink)}.items{margin-top:18px;font-size:14px}.bottom{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{background:var(--ink);color:white;border:0;padding:12px 18px;cursor:pointer;font:inherit;font-size:13px}.small{background:none;color:var(--muted);border:0;text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}.notice{padding:25px;border:1px solid var(--line);border-radius:10px;background:white}.langs{display:flex;gap:10px}.langs button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}.langs button.active{color:var(--ink);font-weight:600}@media(max-width:600px){h1{font-size:38px}main{margin:28px auto}.steps li{font-size:10px}.order{padding:16px}header{padding:16px 20px}.brand{font-size:32px}}
</style></head><body><header><a class="brand" href="../">PERLA</a><div class="langs"><button data-lang="hy">ՀԱՅ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button></div><a href="../" id="back">← Магазин</a></header>
<main><h1 id="heading">Мои заказы</h1><p class="intro" id="intro"></p><div id="list" aria-live="polite"></div><div class="bottom"><a href="../" id="shop">Вернуться в магазин</a><button class="small" id="logout" hidden>Выйти</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../config.js"></script><script src="orders.js?v=1"></script></body></html>
